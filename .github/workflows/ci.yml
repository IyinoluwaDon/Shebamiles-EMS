name: PHP checks

on:
  push:
  pull_request:

jobs:
  lint-and-auth-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql
      - name: Lint PHP files
        shell: bash
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Run offline authentication checks
        run: php tests/auth_test.php
      - name: Check first-admin setup guard
        run: php tests/admin_provisioning_test.php
